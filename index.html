<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏸 Badminton Club</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    header { text-align: center; margin-bottom: 30px; }
    header h1 { font-size: 2.5em; color: #667eea; margin-bottom: 10px; }
    .status { text-align: center; padding: 10px; margin-bottom: 20px; border-radius: 10px; font-weight: bold; }
    .status.loading { background: #e3f2fd; color: #1976d2; }
    .status.success { background: #e8f5e9; color: #388e3c; }
    .status.error { background: #ffebee; color: #d32f2f; }
    .matches-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .match-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 10px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transition: transform 0.3s ease; }
    .match-card:hover { transform: translateY(-5px); }
    .match-id { font-size: 0.9em; opacity: 0.8; margin-bottom: 10px; }
    .match-vs { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; gap: 10px; }
    .player { flex: 1; text-align: center; }
    .player-name { font-size: 1.1em; font-weight: bold; margin-bottom: 5px; }
    .player-score { font-size: 2em; font-weight: bold; }
    .vs-text { color: rgba(255,255,255,0.7); font-size: 0.9em; }
    .match-status { margin-top: 10px; padding: 10px; background: rgba(255,255,255,0.2); border-radius: 5px; text-align: center; font-size: 0.9em; }
    .empty-message { text-align: center; color: #999; padding: 40px; font-size: 1.1em; }
    .refresh-btn { display: block; margin: 20px auto; padding: 10px 30px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 1em; transition: background 0.3s ease; }
    .refresh-btn:hover { background: #764ba2; }
    footer { text-align: center; margin-top: 30px; color: #999; font-size: 0.9em; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🏸 Badminton Club</h1>
    <p>Live Match Results</p>
  </header>

  <div id="status" class="status loading">⏳ Loading...</div>
  <button class="refresh-btn" onclick="loadMatches()">🔄 Refresh</button>
  <div id="matchesContainer" class="matches-container"></div>
  <footer><p>Auto-updating every 5 seconds</p></footer>
</div>

<script>
  const SUPABASE_URL = 'https://tprmqsfbeyqurwqpmpia.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_NeMrUwr4zRl1zRwXZcZN-g_1TkTPdxk';
  const { createClient } = window.supabase;
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  const statusEl = document.getElementById('status');
  const containerEl = document.getElementById('matchesContainer');

  async function loadMatches() {
    try {
      statusEl.className = 'status loading';
      statusEl.textContent = '⏳ Loading matches...';
      containerEl.innerHTML = '';

      const { data: matches, error: matchError } = await supabase
        .from('matches')
        .select('*')
        .order('id', { ascending: false })
        .limit(20);

      if (matchError) throw matchError;

      const { data: players, error: playerError } = await supabase
        .from('players')
        .select('id, name');

      if (playerError) throw playerError;

      const playerMap = {};
      if (players) {
        players.forEach(p => {
          playerMap[p.id] = p.name || `Player ${p.id}`;
        });
      }

      if (!matches || matches.length === 0) {
        containerEl.innerHTML = '<div class="empty-message">No matches found</div>';
        statusEl.className = 'status error';
        statusEl.textContent = '❌ No matches available';
        return;
      }

      matches.forEach(match => {
        const p1 = playerMap[match.player1_id] || 'Player 1';
        const p2 = playerMap[match.player2_id] || 'Player 2';
        const s1 = match.score1 || 0;
        const s2 = match.score2 || 0;

        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
          <div class="match-id">Match #${match.id}</div>
          <div class="match-vs">
            <div class="player">
              <div class="player-name">${p1}</div>
              <div class="player-score">${s1}</div>
            </div>
            <div class="vs-text">VS</div>
            <div class="player">
              <div class="player-name">${p2}</div>
              <div class="player-score">${s2}</div>
            </div>
          </div>
          <div class="match-status">${match.status || 'Ongoing'}</div>
        `;
        containerEl.appendChild(card);
      });

      statusEl.className = 'status success';
      statusEl.textContent = `✅ Loaded ${matches.length} matches`;

    } catch (error) {
      console.error('Error:', error);
      statusEl.className = 'status error';
      statusEl.textContent = `❌ Error: ${error.message}`;
      containerEl.innerHTML = `<div class="empty-message">Error loading data</div>`;
    }
  }

  loadMatches();
  setInterval(loadMatches, 5000);
</script>

</body>
</html>
